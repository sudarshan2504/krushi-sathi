<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="50%" stop-color="#143e2e"/>
      <stop offset="100%" stop-color="#0a1f16"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow)"/>

  <!-- Border grid accents -->
  <rect x="20" y="20" width="560" height="360" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Center Icon Graphic -->
  <g transform="translate(300, 150)">
    <!-- Circle backing -->
    <circle r="48" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2"/>
    
    <!-- Stylized Leaf -->
    <path d="M-18 16 C-24 -8 -6 -32 20 -28 C24 -4 14 24 -18 16 Z" fill="url(#leafGrad)"/>
    <path d="M-18 16 Q2 -2 20 -28" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-4 6 Q8 4 14 0" fill="none" stroke="#047857" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-10 12 Q-2 10 4 6" fill="none" stroke="#047857" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Search/Shield Badge overlay -->
    <g transform="translate(18, 16)">
      <circle r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
      <path d="M-6 -6 L6 6 M6 -6 L-6 6" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Text Labels -->
  <text x="300" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="0.5">
    Verified Field Photo Not Available
  </text>
  
  <text x="300" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94a3b8">
    Refer to symptom description and look-alike guides below
  </text>

  <!-- Advisory tag -->
  <g transform="translate(300, 318)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
    <text x="0" y="4.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#fbbf24">
      Consult RSK / KVK for physical diagnosis
    </text>
  </g>
</svg>
